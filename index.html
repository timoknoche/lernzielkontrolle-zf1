<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernzielkontrolle Zugführer Teil 1</title>
<style>
/* Lernzielkontrolle ZF 1 – Oberfläche im Stil einer Vips-Aufgabenblatt-Ansicht
 * Layout: linke Spalte Aufgabenblatt-Navigation, rechts Aufgabe mit Hinweisbox und Speichern-Leiste;
 * unter 820 px stapelt sich alles einspaltig. */
:root {
  --bg: #ffffff;
  --panel: #eeeeee;
  --panel-strong: #d6d6d6;
  --line: #d0d0d0;
  --fg: #1e1e1e;
  --muted: #5f6368;
  --link: #28497c;
  --accent: #d51e46;          /* Rot der Aufgabenblatt-Kopfzeile */
  --accent-fg: #ffffff;
  --current: #f4b800;         /* Markierung der aktuellen Aufgabe */
  --hint-bg: #fcf1d6;
  --hint-line: #b9a26b;
  --ok: #3c8a2e;
  --ok-bg: #e7f3e3;
  --bad: #b3261e;
  --bad-bg: #fbe7e6;
  --focus: #28497c;
  --shade: rgba(0, 0, 0, .45);   /* Abdunklung hinter dem Seitenmenü (beide Themes) */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17191c; --panel: #23262b; --panel-strong: #33373e; --line: #3b4048;
    --fg: #e8e8e8; --muted: #a4a9b1; --link: #8fb4ec; --accent: #d9385b; --accent-fg: #ffffff;
    --current: #e0a800; --hint-bg: #3a3322; --hint-line: #7d6c43;
    --ok: #7cc66b; --ok-bg: #1f3320; --bad: #f2837a; --bad-bg: #3a1f1d; --focus: #8fb4ec;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17191c; --panel: #23262b; --panel-strong: #33373e; --line: #3b4048;
  --fg: #e8e8e8; --muted: #a4a9b1; --link: #8fb4ec; --accent: #d9385b; --accent-fg: #ffffff;
  --current: #e0a800; --hint-bg: #3a3322; --hint-line: #7d6c43;
  --ok: #7cc66b; --ok-bg: #1f3320; --bad: #f2837a; --bad-bg: #3a1f1d; --focus: #8fb4ec;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 16px; line-height: 1.45;
  padding-inline: 16px; padding-block: 12px 32px;
}
a { color: var(--link); }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.tabular { font-variant-numeric: tabular-nums; }

/* Gesamtraster */
.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; max-width: 1400px; margin: 0 auto; }
/* Kopfleiste und Seitenmenü nur auf schmalen Bildschirmen */
.topbar, .backdrop { display: none; }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .topbar {
    display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 0; margin-top: -12px;
  }
  .menu-btn {
    font: inherit; font-size: 17px; border: 1px solid var(--link); color: var(--link); background: var(--bg);
    border-radius: 3px; padding: 6px 12px; cursor: pointer; flex: none;
  }
  .topbar-titel { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-info { display: flex; gap: 12px; color: var(--muted); white-space: nowrap; }
  .layout > .side {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 30; width: min(86vw, 340px);
    background: var(--bg); border-right: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-105%); visibility: hidden;
  }
  .menu-open > .side { transform: none; visibility: visible; }
  .layout > .side .sheet ol { max-height: none; overflow: visible; }
  .menu-open > .backdrop { display: block; position: fixed; inset: 0; z-index: 25; background: var(--shade); border: 0; padding: 0; }
  body.menu-offen { overflow: hidden; }
  .layout .main, .layout .review .pool-q { scroll-margin-top: 64px; }
}
@media (max-width: 820px) and (prefers-reduced-motion: no-preference) {
  .layout > .side { transition: transform .2s ease, visibility .2s; }
}

/* Linke Spalte */
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sidenav { display: flex; flex-direction: column; }
.sidenav button {
  text-align: left; background: none; border: 0; border-left: 4px solid transparent;
  padding: 8px 12px; color: var(--link); cursor: pointer; font-size: 17px;
}
.sidenav button[aria-current="page"] { background: var(--panel-strong); color: var(--fg); border-left-color: var(--link); }
.sheet { border: 1px solid var(--line); }
.sheet h2 {
  margin: 0; background: var(--accent); color: var(--accent-fg);
  font-size: 17px; font-weight: 700; padding: 7px 8px;
}
.sheet ol { list-style: none; margin: 0; padding: 0; max-height: 60vh; overflow-y: auto; }
.sheet li + li { border-top: 1px solid var(--line); }
.sheet li button {
  width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto 22px; gap: 10px; align-items: center;
  background: none; border: 0; border-left: 4px solid transparent; padding: 9px 10px;
  color: var(--link); cursor: pointer; text-align: left; font-size: 16px;
}
.sheet li button[aria-current="true"] { background: var(--panel); color: var(--fg); border-left-color: var(--current); }
.sheet .pts { color: var(--muted); }
.sheet .aufgabe { display: flex; flex-direction: column; min-width: 0; }
.sheet .thema-kurz { color: var(--muted); font-size: 13px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet li button[aria-current="true"] .thema-kurz { color: var(--fg); }
.umfang-wahl { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.umfang-wahl .choice {
  display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
  border: 2px solid var(--line); border-radius: 4px; padding: 12px 14px; background: var(--bg);
}
.umfang-wahl .choice:hover { background: var(--panel); }
.umfang-wahl .choice:has(input:checked) { border-color: var(--link); background: var(--panel); }
.umfang-wahl .choice input { margin-top: 4px; accent-color: var(--link); flex: none; }
.umfang-wahl .choice > span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.umfang-wahl .choice strong { font-size: 17px; }
.themen-box { border: 1px solid var(--line); border-left: 4px solid var(--link); padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.themen-aktionen { display: flex; gap: 10px; flex-wrap: wrap; }
.start-leiste { display: flex; gap: 12px; flex-wrap: wrap; }
.review .pool-q { scroll-margin-top: 12px; }
.themen-wahl { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 16px; }
.themen-wahl label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; padding: 4px 2px; }
.themen-wahl input { margin-top: 4px; accent-color: var(--link); }
.sheet .mark { color: var(--ok); font-weight: 700; text-align: center; }
.sheet .mark.bad { color: var(--bad); }
.sidebox { border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.sidebox .timer { font-size: 22px; font-weight: 700; }
.sidebox .progress { color: var(--muted); }

/* Kopfzeile rechts */
.crumbs {
  background: var(--panel); display: flex; align-items: center; gap: 14px; padding: 14px 18px; flex-wrap: wrap;
}
.crumbs .arrows { display: flex; gap: 4px; }
.crumbs .arrows button {
  background: none; border: 0; color: var(--muted); font-size: 26px; line-height: 1; padding: 0 6px; cursor: pointer;
}
.crumbs .arrows button:disabled { opacity: .35; cursor: default; }
.crumbs .path { font-size: 21px; min-width: 0; }
.crumbs .path a { text-decoration: none; cursor: pointer; }
.crumbs .spacer { flex: 1; }

.main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* Aufgabe */
.task { border: 1px solid var(--panel); }
.task-head {
  background: var(--panel); display: flex; justify-content: space-between; gap: 12px;
  padding: 10px 14px; font-size: 20px;
}
.task-head .pts { white-space: nowrap; }
.task-body { padding: 14px 14px 22px; display: flex; flex-direction: column; gap: 12px; }
.task-body .thema { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .04em; }
.task-body .text { font-size: 17px; max-width: 75ch; text-wrap: pretty; }
.hint { background: var(--hint-bg); border: 1px dotted var(--hint-line); padding: 8px 10px; max-width: 110ch; }
.hint strong { display: block; margin-bottom: 4px; }
.answers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.answers label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 6px 6px; cursor: pointer; border-radius: 3px; }
.answers input { width: 17px; height: 17px; margin: 3px 0 0; accent-color: var(--link); }
.answers label:hover { background: var(--panel); }
.answers .ok { background: var(--ok-bg); }
.answers .bad { background: var(--bad-bg); }
.answers .tag { font-size: 13px; font-weight: 700; margin-left: 8px; }
.answers .ok .tag { color: var(--ok); }
.answers .bad .tag { color: var(--bad); }
.solution { border-left: 4px solid var(--link); background: var(--panel); padding: 10px 12px; max-width: 110ch; }
.solution p { margin: 0 0 6px; }
.solution .src { color: var(--muted); font-size: 14px; margin: 0; }

.actionbar { background: var(--panel); padding: 12px 14px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--link); background: var(--bg);
  color: var(--link); padding: 8px 18px; border-radius: 3px; cursor: pointer; font-size: 16px;
}
.btn:hover { background: var(--panel); }
.btn.primary { background: var(--link); color: var(--bg); }
.btn.primary:hover { filter: brightness(1.1); background: var(--link); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn .check { font-weight: 700; }
.status { color: var(--muted); }
.status.saved { color: var(--ok); }

/* Startseite / Ergebnis */
.panel { border: 1px solid var(--line); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.panel h1 { margin: 0; font-size: 26px; text-wrap: balance; }
.panel h2 { margin: 0; font-size: 20px; }
.panel p { margin: 0; max-width: 75ch; }
.lead { color: var(--muted); }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.settings fieldset { border: 1px solid var(--line); margin: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.settings legend { font-weight: 700; padding: 0 4px; }
.settings label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.settings input[type="number"] { width: 5em; font: inherit; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 480px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--panel); font-weight: 700; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 8px; background: var(--panel-strong); border-radius: 4px; overflow: hidden; min-width: 80px; }
.bar > span { display: block; height: 100%; background: var(--link); }
.score { display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline; }
.score .big { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 3px 12px; border-radius: 999px; font-weight: 700; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.notice { border: 1px dotted var(--hint-line); background: var(--hint-bg); padding: 10px 12px; }
.confirm { border: 2px solid var(--bad); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.review { display: flex; flex-direction: column; gap: 18px; }
.muted { color: var(--muted); }
details summary { cursor: pointer; color: var(--link); }
.pool-q { border-top: 1px solid var(--line); padding-top: 10px; }
.pool-q ol { margin: 6px 0; }
.pool-q .r { color: var(--ok); font-weight: 700; }
select { font: inherit; padding: 4px; max-width: 100%; }
footer { max-width: 1400px; margin: 28px auto 0; color: var(--muted); font-size: 13px; }
footer p { margin: 0 0 4px; max-width: 110ch; }
@media (prefers-reduced-motion: no-preference) { .bar > span { transition: width .4s ease; } }

</style>
</head>
<body>
<div id="app"><p>Die Lernzielkontrolle wird geladen …</p></div>
<script>
/*
 * Lernzielkontrolle Zugführer Teil 1 – Themengebiete und Testzusammensetzung
 *
 * "anzahl" = Anzahl der Fragen, die aus diesem Themengebiet zufällig
 * in einen Test gezogen werden. Summe aller Werte = Fragen pro Test (40).
 * Die Reihenfolge entspricht dem Ablauf des Lehrgangs (Ankerpunkte Di–Fr).
 *
 * Aufbau einer Frage (in den Dateien 01_… bis 12_…):
 *   (Themen: "kurz" = Kurzname für die Aufgabenliste)
 *
 *   id         eindeutige Kennung, z. B. "fv-01"
 *   thema      id des Themengebiets
 *   frage      Fragetext
 *   antworten  Antwortmöglichkeiten (werden im Test gemischt)
 *   richtig    Indizes der richtigen Antworten (0 = erste Antwort)
 *   quelle     Fundstelle in den Lehrgangsunterlagen / FwDV / NBrandSchG
 *   erklaerung Kurze Begründung für die Auswertung
 */
var LZK_THEMEN = [
  { id: "fv",      name: "FwDV 100 – Führungsvorgang",                kurz: "Führungsvorgang",      ankerpunkt: 1, anzahl: 4 },
  { id: "fs",      name: "FwDV 100 – Führungssystem",                 kurz: "Führungssystem",       ankerpunkt: 1, anzahl: 4 },
  { id: "iuk",     name: "Informations- und Kommunikationstechnik",   kurz: "IuK / Fernmeldewesen", ankerpunkt: 1, anzahl: 3 },
  { id: "abc",     name: "ABC-Gefahren",                              kurz: "ABC-Gefahren",         ankerpunkt: 2, anzahl: 4 },
  { id: "recht",   name: "Rechtsgrundlagen",                          kurz: "Rechtsgrundlagen",     ankerpunkt: 2, anzahl: 4 },
  { id: "fuehren", name: "Führen",                                    kurz: "Führen",               ankerpunkt: 2, anzahl: 3 },
  { id: "bau",     name: "Baukunde",                                  kurz: "Baukunde",             ankerpunkt: 3, anzahl: 3 },
  { id: "vbgs",    name: "Vorbeugender Brand- und Gefahrenschutz",    kurz: "VBGS",                 ankerpunkt: 3, anzahl: 3 },
  { id: "ep",      name: "Einsatzplanung und -vorbereitung",          kurz: "Einsatzplanung",       ankerpunkt: 3, anzahl: 3 },
  { id: "lwf",     name: "Löschwasserförderung",                      kurz: "Löschwasserförderung", ankerpunkt: 4, anzahl: 3 },
  { id: "kfb",     name: "Feuerwehrbereitschaften und Kolonnenfahrt", kurz: "KFB / Kolonnenfahrt",  ankerpunkt: 4, anzahl: 3 },
  { id: "ausb",    name: "Ausbilden",                                 kurz: "Ausbilden",            ankerpunkt: 4, anzahl: 3 }
];

var LZK_FRAGEN = [];

</script>
<script>
/* Themengebiet: FwDV 100 – Führungsvorgang
 * Themen gemäß Lehrgangsunterlagen, belegt mit freien amtlichen Quellen:
 * FwDV 100 (Kap. 3.2.2.1, 3.3, Anlage 5), FwDV 3 (Kap. 5.1–5.4, 6.2, 7.2). */
LZK_FRAGEN.push(
{
  id: "fv-01", thema: "fv",
  lernthema: "Schritte des Führungsvorgangs",
  frage: "In welche Schritte gliedert die FwDV 100 den Führungsvorgang?",
  antworten: [
    "Alarmierung (Ausrücken/Anfahrt) – Lagefeststellung (Erkundung/Kontrolle) – Befehlsgebung",
    "Lagefeststellung (Erkundung/Kontrolle) – Planung (Beurteilung/Entschluss) – Befehlsgebung",
    "Erkundung (Lagemeldung/Anfahrt) – Befehlsgebung (Einzelbefehl/Kommando) – Nachbereitung und Auswertung",
    "Planung (Beurteilung/Entschluss) – Befehlsgebung (Einzelbefehl/Kommando) – Dokumentation"
  ],
  richtig: [1],
  quelle: "FwDV 100, 3.3 Führungsvorgang",
  erklaerung: "Der Führungsvorgang gliedert sich in Lagefeststellung (Erkundung der Lage/Kontrolle), Planung mit Beurteilung der Lage und Entschluss sowie Befehlsgebung."
},
{
  id: "fv-02", thema: "fv",
  lernthema: "Planung – Beurteilung und Entschluss",
  frage: "Welche Bestandteile umfasst die Planung im Führungsvorgang?",
  antworten: ["Beurteilung", "Entschluss", "Erkundung", "Kontrolle", "Lagemeldung"],
  richtig: [0, 1],
  quelle: "FwDV 100, 3.3.2 Planung",
  erklaerung: "Die Planung beinhaltet die Beurteilung und den Entschluss. Erkundung und Kontrolle gehören zur Lagefeststellung."
},
{
  id: "fv-03", thema: "fv",
  lernthema: "Lagefeststellung – Erkundung und Kontrolle",
  frage: "Welche Aussagen zur Lagefeststellung treffen nach FwDV 100 zu?",
  antworten: [
    "Die Lagefeststellung besteht aus der Erkundung und der Kontrolle.",
    "Die Kontrolle ist die erste Phase des Führungsvorganges.",
    "Wichtigste Forderung an die Lagefeststellung ist ihre Aktualität.",
    "Die Lagefeststellung ist mit dem ersten Befehl abgeschlossen.",
    "Die Lagefeststellung ist Aufgabe der Einsatzleiterin oder des Einsatzleiters; nachgeordnete Führungskräfte führen sie nicht durch."
  ],
  richtig: [0, 2],
  quelle: "FwDV 100, 3.3, 3.3.1.1, 3.3.1.3 und 3.3.4",
  erklaerung: "Die Lagefeststellung besteht aus Erkundung und Kontrolle, und ihre wichtigste Forderung ist die Aktualität. Die erste Phase des Führungsvorganges ist die Erkundung, nicht die Kontrolle. Nach der Befehlsgebung wird der Führungsvorgang mit einer erneuten Lagefeststellung fortgesetzt; er ist von den Führungskräften aller Führungsebenen sinngemäß anzuwenden."
},
{
  id: "fv-04", thema: "fv",
  lernthema: "Lagefeststellung – Lagebild",
  frage: "Aus welchen Faktoren bestimmt sich nach FwDV 100 das Lagebild?",
  antworten: [
    "Ort, Zeit und Wetter",
    "Schadenereignis bzw. Gefahrenlage",
    "Möglichkeiten zur Schadenabwehr",
    "Einsatzstatistik der Feuerwehr zu vergleichbaren Einsätzen des Vorjahres",
    "Dienstgrad der Einsatzleiterin oder des Einsatzleiters"
  ],
  richtig: [0, 1, 2],
  quelle: "FwDV 100, 3.3.1.1 (Abbildung 5)",
  erklaerung: "Das Lagebild bestimmt sich aus Ort, Zeit, Wetter, Schadenereignis/Gefahrenlage und den Möglichkeiten zur Schadenabwehr."
},
{
  id: "fv-06", thema: "fv",
  lernthema: "Beurteilung der Lage – Beurteilungsfragen",
  frage: "Welche Fragen gehören zur Beurteilung der Lage nach FwDV 100?",
  antworten: [
    "Welche Gefahren sind für Menschen, Tiere, Umwelt und Sachwerte erkannt?",
    "Welche Gefahr muss zuerst und an welcher Stelle bekämpft werden?",
    "Welche Einheit ist nach dem Einsatz am schnellsten wieder einsatzbereit?",
    "Wer trägt die Kosten des Einsatzes und wie werden sie abgerechnet?",
    "Welche Alarmstufe wurde durch die Leitstelle ausgelöst und warum?"
  ],
  richtig: [0, 1],
  quelle: "FwDV 100, 3.3.2 Planung (Abbildung 6)",
  erklaerung: "Die Beurteilung umfasst u. a. die Fragen nach den erkannten Gefahren für Menschen, Tiere, Umwelt und Sachwerte, der zuerst zu bekämpfenden Gefahr, den Möglichkeiten der Gefahrenabwehr, dem Schutz der Einsatzkräfte, den Vor- und Nachteilen der Möglichkeiten und der Frage, welche Möglichkeit die beste ist. Kosten, Alarmstufe und Wiedereinsatzbereitschaft gehören nicht dazu."
},
{
  id: "fv-12", thema: "fv",
  lernthema: "Entschluss",
  frage: "Welche Aussage zum Entschluss trifft nach FwDV 100 zu?",
  antworten: [
    "Der Entschluss ist die Anordnung an die Einsatzkräfte, Maßnahmen zur Gefahrenabwehr auszuführen.",
    "Von einem gefassten Entschluss darf die Einsatzleiterin oder der Einsatzleiter nur nach einem Wechsel der Einsatzleitung abweichen.",
    "Der Entschluss ist das folgerichtige Ergebnis der Beurteilung der Lage und spiegelt die Einsatzplanung wider.",
    "Ein Entschluss darf erst gefasst werden, wenn Erkundung und Beurteilung der Lage umfassend abgeschlossen sind."
  ],

<script>

(function (root, factory) {
  var api = factory();

  /* Zufallszahl 0 <= n < max; nutzt crypto, wenn vorhanden. rng erlaubt deterministische Tests. */
  function randomInt(max, rng) {
    if (rng) return Math.floor(rng() * max);
    var c = (typeof crypto !== "undefined" && crypto.getRandomValues) ? crypto : null;

  }

  /* Prüft Themen und Fragen; liefert Liste von Fehlermeldungen (leer = ok). */
  function validatePool(themen, fragen) {
    var errors = [];
    var themaIds = {};
    themen.forEach(function (t) {
      if (themaIds[t.id]) errors.push("Thema doppelt: " + t.id);
      themaIds[t.id] = true;
      if (!(t.anzahl >= 0)) errors.push("Thema " + t.id + ": ungültige anzahl");
    });
    var ids = {};
    var count = {};
    fragen.forEach(function (f, i) {
      var where = f && f.id ? f.id : "Frage #" + i;
      if (!f || typeof f !== "object") { errors.push(where + ": kein Objekt"); return; }
      if (!f.id) errors.push(where + ": id fehlt");
      if (ids[f.id]) errors.push(where + ": id doppelt");
      ids[f.id] = true;
      if (!themaIds[f.thema]) errors.push(where + ": unbekanntes Thema " + f.thema);
      if (typeof f.frage !== "string" || !f.frage.trim()) errors.push(where + ": Fragetext fehlt");
      if (!Array.isArray(f.antworten) || f.antworten.length < 3 || f.antworten.length > 6) {
        errors.push(where + ": 3 bis 6 Antworten erwartet");
      } else {
        var seen = {};
        f.antworten.forEach(function (a) {
          if (typeof a !== "string" || !a.trim()) errors.push(where + ": leere Antwort");
          var key = String(a).trim().toLowerCase();
          if (seen[key]) errors.push(where + ": Antwort doppelt: " + a);
          seen[key] = true;
        });
      }
      if (!Array.isArray(f.richtig) || f.richtig.length < 1) {
        errors.push(where + ": keine richtige Antwort");
      } else {
        var r = {};
        f.richtig.forEach(function (k) {
          if (!(Number.isInteger(k) && k >= 0 && Array.isArray(f.antworten) && k < f.antworten.length))
            errors.push(where + ": richtig-Index ungültig: " + k);
          if (r[k]) errors.push(where + ": richtig-Index doppelt: " + k);
          r[k] = true;
        });
        if (Array.isArray(f.antworten) && f.richtig.length >= f.antworten.length)
          errors.push(where + ": alle Antworten richtig – mindestens eine falsche nötig");
      }
      if (typeof f.quelle !== "string" || !f.quelle.trim()) errors.push(where + ": quelle fehlt");
      count[f.thema] = (count[f.thema] || 0) + 1;
    });
    themen.forEach(function (t) {
      var n = count[t.id] || 0;
      if (n < t.anzahl) errors.push("Thema " + t.id + ": nur " + n + " Fragen im Pool, benötigt " + t.anzahl);
    });

  }

  /* Stellt einen Test zusammen: je Thema "anzahl" zufällige Fragen, Reihenfolge und Antworten gemischt.
   * Ergebnis: Liste von { id, order: [Originalindizes der Antworten in Anzeigereihenfolge] } */
  function buildTest(themen, fragen, rng) {
    var byThema = {};
    fragen.forEach(function (f) { (byThema[f.thema] = byThema[f.thema] || []).push(f); });
    var picked = [];
    themen.forEach(function (t) {

      picked = picked.concat(pool.slice(0, t.anzahl));

    return shuffle(picked, rng).map(function (f) {
      var idx = f.antworten.map(function (_, i) { return i; });
      return { id: f.id, order: shuffle(idx, rng) };

  /* Test aus einer festen Fragenliste (z. B. „Fehler wiederholen“), gemischt. */
  function buildTestFromIds(ids, fragenById, rng) {
    return shuffle(ids, rng).filter(function (id) { return fragenById[id]; }).map(function (id) {

  /* Bewertet eine Frage. selected = Originalindizes der gewählten Antworten.
   * modus "streng": 1 Punkt nur bei exakt richtiger Auswahl.
   * modus "teil": (richtig gewählte − falsch gewählte) / Anzahl richtige, mindestens 0. */
  function scoreQuestion(frage, selected, modus) {
    var sel = {};

    var exact = hits === frage.richtig.length && wrong === 0;
    if (modus === "teil") {
      var p = (hits - wrong) / frage.richtig.length;
      return { punkte: Math.max(0, Math.round(p * 100) / 100), exakt: exact };

  }

  /* Gesamtauswertung eines Tests. answers = { frageId: [Originalindizes] } */
  function evaluate(test, fragenById, answers, modus, themen) {
    var perThema = {};
    themen.forEach(function (t) { perThema[t.id] = { punkte: 0, max: 0 }; });
    var total = 0;
    var details = [];
    test.forEach(function (q) {
      var f = fragenById[q.id];
      var res = scoreQuestion(f, answers[q.id], modus);
      total += res.punkte;
      if (perThema[f.thema]) { perThema[f.thema].punkte += res.punkte; perThema[f.thema].max += 1; }
      details.push({ id: q.id, punkte: res.punkte, exakt: res.exakt, beantwortet: !!(answers[q.id] && answers[q.id].length) });
    });
    total = Math.round(total * 100) / 100;
    Object.keys(perThema).forEach(function (k) { perThema[k].punkte = Math.round(perThema[k].punkte * 100) / 100; });
    return { punkte: total, max: test.length, quote: test.length ? total / test.length : 0, perThema: perThema, details: details };
  }

  return {
    shuffle: shuffle, randomInt: randomInt, validatePool: validatePool,
    buildTest: buildTest, buildTestFromIds: buildTestFromIds,
    scoreQuestion: scoreQuestion, evaluate: evaluate
  };
});

</script>
<script>
/*
 * Lernzielkontrolle ZF 1 – Oberfläche
 * Benötigt: LZK_THEMEN, LZK_FRAGEN (src/fragen/*.js) und LZKCore (src/lzk-core.js).
 */
(function () {
  "use strict";

  var STORE_KEY = "lzk-zf1";
  var THEMEN = window.LZK_THEMEN || [];
  var FRAGEN = window.LZK_FRAGEN || [];
  var Core = window.LZKCore;
  var byId = {};
  FRAGEN.forEach(function (f) { byId[f.id] = f; });
  var themaById = {};
  THEMEN.forEach(function (t) { themaById[t.id] = t; });
  var TEST_SIZE = THEMEN.reduce(function (s, t) { return s + t.anzahl; }, 0);

  var DEFAULT_SETTINGS = { umfang: "lzk", modus: "uebung", bewertung: "streng", zeit: 0, grenze: 50 };

  /* Hinweis zu den Inhalten (KI-Unterstützung, Haftungsausschluss) – Startseite, Fußzeile, Kurzform bei jeder Lösung */
  var POOL_STAND = "29.09.2026";
  var HINWEIS = "Die Fragen wurden mit Unterstützung künstlicher Intelligenz (Claude, Anthropic) erstellt und anhand der angegebenen Quellen geprüft. " +
    "Trotz sorgfältiger Prüfung können Fehler enthalten sein; eine Gewähr für Richtigkeit, Vollständigkeit und Aktualität wird nicht übernommen. " +
    "Maßgeblich sind allein die Originaltexte der Feuerwehr-Dienstvorschriften und Gesetze in der jeweils geltenden Fassung. " +
    "Die Software ersetzt weder den Lehrgang noch die Lernunterlagen und ist keine offizielle Prüfung. Stand des Fragenpools: " + POOL_STAND + ".";
  var HINWEIS_KURZ = "KI-gestützt erstellt; ohne Gewähr. Maßgeblich ist der Originaltext der angegebenen Quelle.";

  var state = load() || freshState();
  var timerHandle = null;
  var menuOpen = false;   /* Seitenmenü auf schmalen Bildschirmen (nicht gespeichert) */
  var app = document.getElementById("app");

  /* ---------- Speicher ---------- */
  function freshState() {
    return { view: "start", settings: copy(DEFAULT_SETTINGS), test: null, answers: {}, drafts: {}, saved: {},
             revealed: {}, current: 0, startedAt: 0, deadline: 0, result: null, confirm: false, poolFilter: "",
             art: "lzk", artThemen: [], uebenThemen: [] };
  }
  /* Testarten: "lzk" = Lernzielkontrolle (40 Fragen), "thema" = Themenübung, "wiederholung" = falsch beantwortete Fragen */
  function artLabel() {
    if (state.art === "thema") return "Themenübung";
    if (state.art === "wiederholung") return "Wiederholung";
    return "Lernzielkontrolle";
  }
  function themenListe(ids) {
    return ids.map(function (id) { return themaById[id] ? themaById[id].kurz || themaById[id].name : id; }).join(", ");
  }
  function copy(o) { return JSON.parse(JSON.stringify(o)); }
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (s.test) s.test = s.test.filter(function (q) { return byId[q.id]; });
      s.settings = Object.assign(copy(DEFAULT_SETTINGS), s.settings || {});
      s.confirm = false;
      return Object.assign(freshState(), s);
    } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* Speicher nicht verfügbar */ }
  }

  /* ---------- Hilfen ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtPts(n) { return (Math.round(n * 100) / 100).toLocaleString("de-DE"); }
  function fmtPct(q) { return Math.round(q * 1000) / 10 + " %"; }
  function fmtTime(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(s / 60), r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  function testRunning() { return !!(state.test && !state.result); }
  function countSaved() { return state.test ? state.test.filter(function (q) { return state.saved[q.id]; }).length : 0; }
  function sameSet(a, b) {
    a = (a || []).slice().sort(); b = (b || []).slice().sort();
    return a.length === b.length && a.every(function (v, i) { return v === b[i]; });
  }

  /* ---------- Aktionen ---------- */
  function startTest(ids, art, themen) {
    var s = state.settings;
    state.test = ids ? Core.buildTestFromIds(ids, byId) : Core.buildTest(THEMEN, FRAGEN);
    state.art = art || "lzk";
    state.artThemen = themen || [];
    state.answers = {}; state.drafts = {}; state.saved = {}; state.revealed = {};
    state.current = 0; state.result = null; state.confirm = false;
    state.startedAt = Date.now();
    state.deadline = s.zeit > 0 ? state.startedAt + s.zeit * 60000 : 0;
    state.view = "test";
    save(); render();
    window.scrollTo(0, 0);
  }
  function saveAnswer() {
    var q = state.test[state.current];
    var sel = state.drafts[q.id] || [];
    state.answers[q.id] = sel.slice();
    state.saved[q.id] = true;
    if (state.settings.modus === "uebung") state.revealed[q.id] = true;
    save(); render("saved");
  }
  function finishTest() {
    state.result = Core.evaluate(state.test, byId, state.answers, state.settings.bewertung, THEMEN);
    state.result.dauer = Date.now() - state.startedAt;
    state.confirm = false;
    state.view = "result";
    save(); render();
    window.scrollTo(0, 0);
  }
  function goto(i) {
    if (!state.test) return;
    state.current = Math.max(0, Math.min(state.test.length - 1, i));
    if (state.result) {
      /* Nach der Abgabe: zur Auswertung dieser Aufgabe in den Ergebnissen springen */
      state.view = "result";
      save(); render();
      var item = document.getElementById("auswertung-" + state.current);
      if (item) item.scrollIntoView({ block: "start" });
      return;
    }
    state.view = "test";
    save(); render();
    var main = document.getElementById("main");
    if (main && main.getBoundingClientRect().top < 0) main.scrollIntoView({ block: "start" });
  }

  /* ---------- Timer ---------- */
  function tick() {
    if (!testRunning() || !state.deadline) return;
    var left = state.deadline - Date.now();
    ["timer", "timer-top"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.textContent = fmtTime(left);
    });
    if (left <= 0) finishTest();
  }
  function ensureTimer() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = testRunning() && state.deadline ? setInterval(tick, 1000) : null;
  }

  /* ---------- Rendering ---------- */
  function render(flash) {
    var html = '<div class="layout' + (menuOpen ? " menu-open" : "") + '">' + renderTopbar() + renderSide() +
      (menuOpen ? '<button class="backdrop" data-act="menu" aria-label="Menü schließen" tabindex="-1"></button>' : "") +
      '<main class="main" id="main">';
    if (state.view === "test" && testRunning()) html += renderTask(flash);
    else if (state.view === "result" && state.result) html += renderResult();
    else if (state.view === "pool") html += renderPool();
    else html += renderStart();
    html += "</main></div>" + renderFooter();
    app.innerHTML = html;
    document.body.classList.toggle("menu-offen", menuOpen);
    ensureTimer();
    tick();
  }

  /* Kopfleiste für schmale Bildschirme: Menüknopf, aktuelle Ansicht, Fortschritt und Restzeit */
  function renderTopbar() {
    var label = { start: "Startseite", test: artLabel(), result: "Ergebnisse", pool: "Fragenpool" }[state.view] || "";
    var info = "";
    if (testRunning()) {
      if (state.deadline) info += '<span class="tabular" id="timer-top">' + fmtTime(state.deadline - Date.now()) + "</span>";
      info += '<span class="tabular" title="gespeicherte Aufgaben">' + countSaved() + "/" + state.test.length + "</span>";
    }
    return '<div class="topbar"><button class="menu-btn" data-act="menu" aria-expanded="' + menuOpen + '" aria-controls="seitenmenue">' +
      '<span aria-hidden="true">☰</span> Menü</button><span class="topbar-titel">' + esc(label) + '</span><span class="topbar-info">' + info + "</span></div>";
  }

  function renderSide() {
    var v = state.view;
    var h = '<aside class="side" id="seitenmenue"><nav class="sidenav" aria-label="Bereiche">' +
      '<button data-act="nav" data-view="' + (testRunning() ? "test" : "start") + '"' + ((v === "start" || v === "test") ? ' aria-current="page"' : "") + ">Aufgabenblätter</button>" +
      '<button data-act="nav" data-view="result"' + (v === "result" ? ' aria-current="page"' : "") + (state.result ? "" : " disabled") + ">Ergebnisse</button>" +
      '<button data-act="nav" data-view="pool"' + (v === "pool" ? ' aria-current="page"' : "") + ">Fragenpool</button></nav>";

    if (state.test) {
      var showMarks = !!state.result || state.settings.modus === "uebung";
      h += '<section class="sheet" aria-label="Aufgabenblatt"><h2>Aufgabenblatt</h2><ol>';
      state.test.forEach(function (q, i) {
        var cur = ((state.view === "test" || state.view === "result") && i === state.current) ? ' aria-current="true"' : "";
        var mark = "";
        if (state.result) {
          var d = state.result.details[i];
          mark = d.exakt ? '<span class="mark" title="richtig">✔</span>' : '<span class="mark bad" title="nicht voll richtig">✘</span>';
        } else if (showMarks && state.revealed[q.id]) {
          var ex = Core.scoreQuestion(byId[q.id], state.answers[q.id], "streng").exakt;
          mark = ex ? '<span class="mark">✔</span>' : '<span class="mark bad">✘</span>';
        } else if (state.saved[q.id]) {
          mark = '<span class="mark" title="gespeichert">✔</span>';
        } else mark = '<span class="mark"></span>';
        var pts = state.result ? fmtPts(state.result.details[i].punkte) + " / 1" : "1 Punkt";
        var th = themaById[byId[q.id].thema];
        h += '<li><button data-act="goto" data-i="' + i + '"' + cur + '><span class="aufgabe">Aufgabe ' + (i + 1) +
          '<span class="thema-kurz">' + esc(th ? th.kurz || th.name : "") + '</span></span><span class="pts tabular">' + pts + "</span>" + mark + "</button></li>";
      });
      h += "</ol></section>";
      if (testRunning()) {
        h += '<div class="sidebox">';
        if (state.deadline) h += '<div>Restbearbeitungszeit</div><div class="timer tabular" id="timer">' + fmtTime(state.deadline - Date.now()) + "</div>";
        h += '<div class="progress tabular">' + countSaved() + " von " + state.test.length + " Aufgaben gespeichert</div>";
        h += '<button class="btn danger" data-act="askfinish">Test abgeben</button></div>';
      }
    }
    return h + "</aside>";
  }

  function renderCrumbs(title, withArrows) {
    var h = '<div class="crumbs">';
    if (withArrows) {
      h += '<div class="arrows"><button data-act="prev" aria-label="Vorige Aufgabe"' + (state.current === 0 ? " disabled" : "") + ">‹</button>" +
        '<button data-act="next" aria-label="Nächste Aufgabe"' + (state.current >= state.test.length - 1 ? " disabled" : "") + ">›</button></div>";
    }
    h += '<div class="path">' + title + '</div><div class="spacer"></div></div>';
    return h;
  }

  function renderStart() {
    var s = state.settings;
    var poolCount = poolCounts();
    var themen = s.umfang === "themen";
    var h = renderCrumbs("Lernzielkontrolle Zugführer Teil 1", false);
    h += '<section class="panel"><h1>Lernzielkontrolle Zugführer Teil 1</h1>' +
      '<p class="lead">Übungstest zur Selbstkontrolle mit ' + FRAGEN.length + ' Multiple-Choice-Fragen aus ' + THEMEN.length +
      ' Themengebieten. Bei jeder Frage können eine oder mehrere Antworten richtig sein.</p>';
    if (testRunning()) {
      h += '<div class="notice">Eine begonnene ' + artLabel() + " ist noch offen (" + countSaved() + " von " + state.test.length +
        ' Aufgaben gespeichert). <button class="btn" data-act="nav" data-view="test">Test fortsetzen</button></div>';
    }
    h += '<h2>Was möchtest du tun?</h2><form id="umfang" class="umfang-wahl">' +
      choice("lzk", s.umfang, "Lernzielkontrolle", TEST_SIZE + " zufällige Fragen aus allen Themengebieten") +
      choice("themen", s.umfang, "Einzelne Themen üben", "alle Fragen der ausgewählten Themengebiete") + "</form>";
    if (themen) {
      h += '<div class="themen-box"><form id="ueben" class="themen-wahl">';
      THEMEN.forEach(function (t) {
        var id = "ueben-" + t.id;
        h += '<label for="' + id + '"><input type="checkbox" id="' + id + '" name="ueben" value="' + t.id + '"' +
          (state.uebenThemen.indexOf(t.id) >= 0 ? " checked" : "") + "> <span>" + esc(t.name) +
          ' <span class="muted tabular">(' + (poolCount[t.id] || 0) + ")</span></span></label>";
      });
      h += '</form><div class="themen-aktionen"><button class="btn" data-act="ueben-alle">Alle auswählen</button>' +
        '<button class="btn" data-act="ueben-keine">Auswahl aufheben</button></div></div>';
    }
    h += '<h2>Einstellungen</h2><form id="settings" class="settings">' +
      '<fieldset><legend>Modus</legend>' +
      radio("modus", "uebung", s.modus, "Übung – Lösung nach jedem Speichern") +
      radio("modus", "pruefung", s.modus, "Prüfung – Auswertung erst nach Abgabe") + "</fieldset>" +
      '<fieldset><legend>Bewertung</legend>' +
      radio("bewertung", "streng", s.bewertung, "1 Punkt nur bei vollständig richtiger Auswahl") +
      radio("bewertung", "teil", s.bewertung, "Teilpunkte (falsche Kreuze werden abgezogen)") + "</fieldset>" +
      '<fieldset><legend>Bearbeitungszeit</legend>' +
      radio("zeit", "0", String(s.zeit), "ohne Zeitbegrenzung") +
      radio("zeit", "45", String(s.zeit), "45 Minuten") +
      radio("zeit", "60", String(s.zeit), "60 Minuten") +
      radio("zeit", "90", String(s.zeit), "90 Minuten") + "</fieldset>" +
      '<fieldset><legend>Bestehensgrenze</legend><label for="grenze">Mindestens <input id="grenze" name="grenze" type="number" min="0" max="100" step="5" value="' +
      esc(s.grenze) + '"> % der Punkte</label><span class="muted">Frei einstellbar, kein offizieller Wert.</span></fieldset>' +
      "</form>" +
      '<div class="start-leiste">' + startButton(poolCount) + "</div>" +
      '<div class="notice" role="note"><strong>Hinweis zu den Inhalten:</strong> ' + esc(HINWEIS) + "</div>";
    if (!themen) {
      h += '<h2>Zusammensetzung eines Tests</h2><div class="table-wrap"><table><thead><tr><th>Themengebiet</th><th class="num">Fragen im Test</th><th class="num">Fragen im Pool</th></tr></thead><tbody>';
      THEMEN.forEach(function (t) {
        h += "<tr><td>" + esc(t.name) + '</td><td class="num">' + t.anzahl + '</td><td class="num">' + (poolCount[t.id] || 0) + "</td></tr>";
      });
      h += '<tr><th>Summe</th><th class="num">' + TEST_SIZE + '</th><th class="num">' + FRAGEN.length + "</th></tr></tbody></table></div>";
    }
    return h + "</section>";
  }
  /* Startknopf passend zur Auswahl „Lernzielkontrolle“ oder „Einzelne Themen üben“ */
  function startButton(poolCount) {
    var offen = testRunning() ? " (verwirft den offenen Test)" : "";
    if (state.settings.umfang !== "themen") {
      return '<button class="btn primary" id="start-btn" data-act="start">Test starten' + offen + "</button>";
    }
    var n = state.uebenThemen.reduce(function (s, id) { return s + (poolCount[id] || 0); }, 0);
    return '<button class="btn primary" id="start-btn" data-act="ueben"' + (n ? "" : " disabled") + ">" +
      (n ? "Ausgewählte Themen üben (" + n + " Fragen)" + offen : "Mindestens ein Thema auswählen") + "</button>";
  }
  function choice(value, current, title, text) {
    var id = "umfang-" + value;
    return '<label class="choice" for="' + id + '"><input type="radio" id="' + id + '" name="umfang" value="' + value + '"' +
      (current === value ? " checked" : "") + '><span><strong>' + esc(title) + '</strong><span class="muted">' + esc(text) + "</span></span></label>";
  }
  function poolCounts() {
    var c = {};
    FRAGEN.forEach(function (f) { c[f.thema] = (c[f.thema] || 0) + 1; });
    return c;
  }
  function radio(name, value, current, label) {
    var id = name + "-" + value;
    return '<label for="' + id + '"><input type="radio" id="' + id + '" name="' + name + '" value="' + value + '"' + (String(current) === value ? " checked" : "") + "> " + esc(label) + "</label>";
  }

  function renderTask(flash) {
    var q = state.test[state.current];
    var f = byId[q.id];
    var thema = themaById[f.thema];
    if (!state.drafts[q.id]) state.drafts[q.id] = (state.answers[q.id] || []).slice();
    var draft = state.drafts[q.id];
    var revealed = state.settings.modus === "uebung" && state.revealed[q.id];
    var nr = state.current + 1;
    var h = renderCrumbs('<a data-act="nav" data-view="start">' + artLabel() + "</a> / " + nr + ". Frage", true);
    h += '<section class="task"><div class="task-head"><span>' + nr + ". Frage</span><span class=\"pts\">1 Punkt</span></div>" +
      '<div class="task-body"><div class="thema">' + esc(thema ? thema.name : "") + "</div>" +
      '<div class="text">' + esc(f.frage) + "</div>" +
      '<div class="hint"><strong>Hinweis:</strong>Dies ist eine Multiple-Choice-Frage, hier sind eine oder mehrere Antworten richtig.</div>' +
      '<ul class="answers" role="group" aria-label="Antworten">';
    q.order.forEach(function (orig, k) {
      var checked = draft.indexOf(orig) >= 0;
      var cls = "", tag = "";
      if (revealed) {
        var isRight = f.richtig.indexOf(orig) >= 0;
        var chosen = (state.answers[q.id] || []).indexOf(orig) >= 0;
        if (isRight) { cls = "ok"; tag = chosen ? "richtig" : "richtig – nicht angekreuzt"; }
        else if (chosen) { cls = "bad"; tag = "falsch"; }
      }
      var id = "a-" + nr + "-" + k;
      h += '<li><label for="' + id + '" class="' + cls + '"><input type="checkbox" id="' + id + '" data-act="toggle" data-orig="' + orig + '"' +
        (checked ? " checked" : "") + (revealed ? " disabled" : "") + "><span>" + esc(f.antworten[orig]) +
        (tag ? '<span class="tag">' + tag + "</span>" : "") + "</span></label></li>";
    });
    h += "</ul>";
    if (revealed) h += renderSolution(f);
    h += "</div></section>";

    var dirty = !sameSet(draft, state.answers[q.id]) || !state.saved[q.id];
    var status = "";
    if (flash === "saved") status = '<span class="status saved" role="status">Die Antwort wurde gespeichert.</span>';
    else if (state.saved[q.id] && !dirty) status = '<span class="status saved">Gespeichert</span>';
    else if (state.saved[q.id] && dirty) status = '<span class="status" role="status">Geänderte Auswahl ist noch nicht gespeichert.</span>';
    h += '<div class="actionbar"><button class="btn" data-act="save"' + (revealed ? " disabled" : "") + '><span class="check">✔</span> ' +
      (state.settings.modus === "uebung" ? "Speichern und prüfen" : "Speichern") + "</button>" +
      (state.current < state.test.length - 1 ? '<button class="btn" data-act="next">Nächste Aufgabe</button>' : "") + status + "</div>";

    if (state.confirm) {
      var open = state.test.length - countSaved();
      h += '<div class="confirm" role="alertdialog" aria-label="Test abgeben"><strong>Test jetzt abgeben?</strong>' +
        "<span>" + (open ? open + " Aufgabe(n) sind noch nicht gespeichert und werden mit 0 Punkten bewertet. " : "Alle Aufgaben sind gespeichert. ") +
        "Nach der Abgabe sind keine Änderungen mehr möglich.</span>" +
        '<div class="actionbar"><button class="btn danger" data-act="finish">Ja, abgeben</button><button class="btn" data-act="cancelfinish">Weiter bearbeiten</button></div></div>';
    }
    return h;
  }

  function renderSolution(f) {
    return '<div class="solution">' + (f.erklaerung ? "<p>" + esc(f.erklaerung) + "</p>" : "") +
      (f.lernthema ? '<p class="src">Lehrgangsthema: ' + esc(f.lernthema) + "</p>" : "") +
      '<p class="src">Quelle: ' + esc(f.quelle) + "</p>" +
      '<p class="src">' + esc(HINWEIS_KURZ) + "</p></div>";
  }

  function renderResult() {
    var r = state.result, s = state.settings;
    var passed = r.quote * 100 >= Number(s.grenze);
    var h = renderCrumbs("Ergebnisse", false);
    h += '<section class="panel"><h1>Ergebnis – ' + artLabel() + "</h1>" +
      (state.art === "thema" ? '<p class="muted">Geübte Themen: ' + esc(themenListe(state.artThemen)) + "</p>" : "") +
      '<div class="score"><span class="big">' + fmtPts(r.punkte) + " / " + r.max + "</span>" +
      '<span class="tabular">' + fmtPct(r.quote) + '</span><span class="pill ' + (passed ? "ok" : "bad") + '">' +
      (passed ? "bestanden" : "nicht bestanden") + "</span></div>" +
      '<p class="muted">Bestehensgrenze ' + esc(s.grenze) + " % · Bewertung: " + (s.bewertung === "teil" ? "Teilpunkte" : "nur vollständig richtige Antworten") +
      " · Bearbeitungszeit " + fmtTime(r.dauer || 0) + " min</p>" +
      '<h2>Nach Themengebiet</h2><div class="table-wrap"><table><thead><tr><th>Themengebiet</th><th class="num">Punkte</th><th>Anteil</th></tr></thead><tbody>';
    THEMEN.forEach(function (t) {
      var p = r.perThema[t.id];
      if (!p || !p.max) return;
      var q = p.punkte / p.max;
      h += "<tr><td>" + esc(t.name) + '</td><td class="num">' + fmtPts(p.punkte) + " / " + p.max + '</td><td><div class="bar" aria-label="' + fmtPct(q) + '"><span style="width:' + Math.round(q * 100) + '%"></span></div></td></tr>';
    });
    h += "</tbody></table></div>";
    var wrong = r.details.filter(function (d) { return !d.exakt; }).map(function (d) { return d.id; });
    h += '<div class="actionbar"><button class="btn primary" data-act="start">Neuen Test starten</button>' +
      (wrong.length ? '<button class="btn" data-act="retry">Nicht richtig beantwortete Fragen üben (' + wrong.length + ")</button>" : "") + "</div></section>";

    h += '<section class="panel"><h2>Auswertung der Aufgaben</h2><div class="review">';
    state.test.forEach(function (q, i) {
      var f = byId[q.id], d = r.details[i];
      h += '<div class="pool-q" id="auswertung-' + i + '"><div class="score"><strong>' + (i + 1) + ". Frage</strong><span class=\"pill " + (d.exakt ? "ok" : "bad") + '">' +
        fmtPts(d.punkte) + " / 1</span>" + (d.beantwortet ? "" : '<span class="muted">nicht beantwortet</span>') + "</div>" +
        '<div class="text">' + esc(f.frage) + '</div><ul class="answers">';
      q.order.forEach(function (orig) {
        var isRight = f.richtig.indexOf(orig) >= 0;
        var chosen = (state.answers[q.id] || []).indexOf(orig) >= 0;
        var cls = isRight ? "ok" : (chosen ? "bad" : "");
        var tag = isRight ? (chosen ? "richtig angekreuzt" : "richtig – nicht angekreuzt") : (chosen ? "falsch angekreuzt" : "");
        h += '<li><label class="' + cls + '"><input type="checkbox" disabled' + (chosen ? " checked" : "") + "><span>" + esc(f.antworten[orig]) +
          (tag ? '<span class="tag">' + tag + "</span>" : "") + "</span></label></li>";
      });
      h += "</ul>" + renderSolution(f) + "</div>";
    });
    return h + "</div></section>";
  }

  function renderPool() {
    var h = renderCrumbs("Fragenpool", false);
    h += '<section class="panel"><h1>Fragenpool</h1><p class="lead">Alle ' + FRAGEN.length +
      ' Fragen mit Lösung und Quelle, z. B. für die Lehrgangsleitung oder zum Nacharbeiten.</p>' +
      '<label for="poolFilter">Themengebiet <select id="poolFilter" data-act="filter"><option value="">Alle Themengebiete</option>';
    THEMEN.forEach(function (t) {
      h += '<option value="' + t.id + '"' + (state.poolFilter === t.id ? " selected" : "") + ">" + esc(t.name) + "</option>";
    });
    h += "</select></label>";
    FRAGEN.filter(function (f) { return !state.poolFilter || f.thema === state.poolFilter; }).forEach(function (f) {
      h += '<div class="pool-q"><div class="muted">' + esc(f.id) + " · " + esc(themaById[f.thema] ? themaById[f.thema].name : f.thema) + (f.lernthema ? " · " + esc(f.lernthema) : "") + "</div><strong>" + esc(f.frage) + "</strong><ol type=\"a\">";
      f.antworten.forEach(function (a, i) {
        var r = f.richtig.indexOf(i) >= 0;
        h += "<li" + (r ? ' class="r"' : "") + ">" + esc(a) + (r ? " ✔" : "") + "</li>";
      });
      h += "</ol>" + renderSolution(f) + "</div>";
    });
    return h + "</section>";
  }

  function renderFooter() {
    return "<footer><p>Übungssoftware zur Selbstkontrolle für den Lehrgang Zugführer Teil 1 (Niedersachsen). Kein offizielles Angebot und keine offizielle Prüfung einer Behörde oder Ausbildungseinrichtung.</p>" +
      "<p>Die Fragen beruhen ausschließlich auf frei verfügbaren Quellen (Feuerwehr-Dienstvorschriften, Niedersächsisches Brandschutzgesetz und weitere amtliche Rechtstexte und Erlasse) und sind eigenständig formuliert. Nutzung nur nicht gewerblich.</p>" +
      "<p><strong>Hinweis zu den Inhalten:</strong> " + esc(HINWEIS) + "</p>" +
      "<p><strong>Datenschutz:</strong> Die Seite setzt keine Cookies, verwendet keine Analyse- oder Trackingdienste und lädt keine Inhalte von Drittanbietern. " +
      "Einstellungen und Antworten werden nur lokal im eigenen Browser gespeichert und nicht übertragen. Beim Aufruf verarbeitet der Webhoster technisch notwendige Verbindungsdaten (z. B. die IP-Adresse).</p></footer>";
  }

  /* ---------- Ereignisse ---------- */
  app.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act]");
    if (!el || el.disabled) return;
    var act = el.getAttribute("data-act");
    if (act === "toggle" || act === "filter") return;
    ev.preventDefault();
    if (act === "menu") {
      menuOpen = !menuOpen; render();
      if (menuOpen) {
        var cur = document.querySelector(".sheet li button[aria-current=\"true\"]");
        if (cur) cur.scrollIntoView({ block: "center" });
        var first = document.querySelector(".sidenav button");
        if (first) first.focus({ preventScroll: true });
      } else {
        var mb = document.querySelector(".menu-btn"); if (mb) mb.focus();
      }
      return;
    }
    if (menuOpen) { menuOpen = false; document.body.classList.remove("menu-offen"); }
    switch (act) {
      case "start": startTest(); break;
      case "retry":
        var ids = state.result.details.filter(function (d) { return !d.exakt; }).map(function (d) { return d.id; });
        startTest(ids, "wiederholung"); break;
      case "ueben":
        var sel = state.uebenThemen.slice();
        if (!sel.length) return;
        startTest(FRAGEN.filter(function (f) { return sel.indexOf(f.thema) >= 0; }).map(function (f) { return f.id; }), "thema", sel); break;
      case "ueben-alle":
      case "ueben-keine":
        state.uebenThemen = act === "ueben-alle" ? THEMEN.map(function (t) { return t.id; }) : [];
        save(); render();
        var u = document.getElementById("ueben"); if (u) u.scrollIntoView({ block: "center" }); break;
      case "nav":
        var v = el.getAttribute("data-view");
        if (v === "test" && !testRunning()) v = "start";
        if (v === "result" && !state.result) return;
        state.view = v; state.confirm = false; save(); render();
        if (v !== "test") window.scrollTo(0, 0);
        else goto(state.current);
        break;
      case "goto": goto(Number(el.getAttribute("data-i"))); break;
      case "prev": goto(state.current - 1); break;
      case "next": goto(state.current + 1); break;
      case "save": saveAnswer(); break;
      case "askfinish": state.view = "test"; state.confirm = true; save(); render();
        var c = document.querySelector(".confirm"); if (c) c.scrollIntoView({ block: "center" }); break;
      case "cancelfinish": state.confirm = false; save(); render(); break;
      case "finish": finishTest(); break;
    }
  });
  app.addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.getAttribute("data-act") === "toggle") {
      var q = state.test[state.current];
      var orig = Number(el.getAttribute("data-orig"));
      var d = state.drafts[q.id] || [];
      d = d.filter(function (x) { return x !== orig; });
      if (el.checked) d.push(orig);
      state.drafts[q.id] = d;
      save();
      var st = document.querySelector(".actionbar .status");
      if (st && state.saved[q.id]) { st.className = "status"; st.textContent = sameSet(d, state.answers[q.id]) ? "Gespeichert" : "Geänderte Auswahl ist noch nicht gespeichert."; }
      return;
    }
    if (el.getAttribute("data-act") === "filter") { state.poolFilter = el.value; save(); render(); return; }
    if (el.name === "ueben") {
      state.uebenThemen = Array.prototype.map.call(document.querySelectorAll('#ueben input[name="ueben"]:checked'), function (x) { return x.value; });
      save();
      var b = document.getElementById("start-btn");
      if (b) b.outerHTML = startButton(poolCounts());
      return;
    }
    if (el.name === "umfang") { state.settings.umfang = el.value; save(); render(); return; }
    if (el.closest("#settings")) {
      var s = state.settings;
      if (el.name === "modus") s.modus = el.value;
      if (el.name === "bewertung") s.bewertung = el.value;
      if (el.name === "zeit") s.zeit = Number(el.value);
      if (el.name === "grenze") s.grenze = Math.max(0, Math.min(100, Number(el.value) || 0));
      save();
    }
  });

  if (!Core || !THEMEN.length || !FRAGEN.length) {
    app.innerHTML = '<div class="panel"><h1>Fragenpool nicht gefunden</h1><p>Die Dateien im Ordner „fragen“ konnten nicht geladen werden.</p></div>';
    return;
  }
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && menuOpen) { menuOpen = false; render(); var mb = document.querySelector(".menu-btn"); if (mb) mb.focus(); }
  });

  if (state.view === "test" && !testRunning()) state.view = "start";
  render();
})();

</script>
</body>
</html>
